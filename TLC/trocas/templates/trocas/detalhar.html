<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Troca</title>
</head>
<body>
    <h1>Detalhes da Troca #{{ troca.id }}</h1>

    <p><strong>Status:</strong> {{ troca.status }}</p>
    <p><strong>Ofertante:</strong> {{ troca.ofertantes }}</p>
    <p><strong>Interessado:</strong> {{ troca.interessado }}</p>
    <p><strong>Data Inicial:</strong> {{ troca.data_inicial }}</p>
    <p><strong>Data Resposta:</strong> {{ troca.data_resposta }}</p>

    <p>
        <a href="{% url 'trocas:editar_troca' troca.id %}">Editar</a> | 
        <a href="{% url 'trocas:listar_trocas' %}">Voltar para a lista</a>
    </p>
</body>
</html>
