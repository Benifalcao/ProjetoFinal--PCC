<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar ObjetoTroca</title>
</head>
<body>
    <!-- ALTERAÇÃO: Form para alteração das condições do objeto na troca -->
    <h1>Editar Objeto na Troca</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar Alterações</button>
    </form>
    <br>
    <a href="{% url 'objetotroca:listar' %}">Cancelar</a>
</body>
</html>
