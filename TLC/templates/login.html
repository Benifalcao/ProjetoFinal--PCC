{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Sistemas de Trocas Locais</title>
  <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/bootstrap-icons/bootstrap-icons.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
</head>
<body>
  <main class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="panel" style="width: 100%; max-width: 420px;">
      <div class="text-center mb-4">
        <span class="page-icon mb-3"><i class="bi bi-arrow-left-right" aria-hidden="true"></i></span>
        <h1 class="h4 mb-1">Sistemas de Trocas Locais</h1>
        <p class="text-muted mb-0">Entre com seu login e senha.</p>
      </div>

      {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
      {% endfor %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        {% for error in form.non_field_errors %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endfor %}

        <div class="mb-3">
          <label class="form-label" for="id_username">Login</label>
          <input class="form-control" type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Senha</label>
          <input class="form-control" type="password" name="password" id="id_password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar</button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        Ainda não tem conta? <a href="{% url 'usuario:usuario_cadastro' %}">Criar conta</a>
      </p>
    </div>
  </main>
</body>
</html>
