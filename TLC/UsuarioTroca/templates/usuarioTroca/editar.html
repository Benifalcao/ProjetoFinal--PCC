{% extends 'base.html' %}

{% block title %}Editar vínculo{% endblock %}

{% block nav_usuario_troca %}active{% endblock %}

{% block content %}
    <h1>Editar Vínculo do Usuário</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar Alterações</button>
    </form>

    <br>
    <a href="{% url 'usuariotroca:listar' %}">Cancelar</a>
{% endblock %}
