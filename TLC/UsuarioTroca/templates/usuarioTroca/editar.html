<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar UsuarioTroca</title>
</head>
<body>
    <!-- ALTERAÇÃO: Form para alteração dos dados do vínculo -->
    <h1>Editar Vínculo do Usuário</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar Alterações</button>
    </form>
    <br>
    <a href="{% url 'usuariotroca:listar' %}">Cancelar</a>
</body>
</html>
